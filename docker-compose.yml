version: '3.9'

networks:
  uno_network:
    driver: bridge

volumes:
  mysql_data:
  redis_data:
  storage_data:

services:
  # ─── Nginx ──────────────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: uno_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./backend:/var/www/backend:ro
      - ./frontend/out:/var/www/frontend:ro
      - storage_data:/var/www/backend/storage/app/public
    depends_on:
      - backend
      - frontend
    networks:
      - uno_network

  # ─── PHP-FPM (Laravel) ──────────────────────────────────
  backend:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    container_name: uno_backend
    restart: unless-stopped
    environment:
      - APP_ENV=${APP_ENV:-production}
      - PHP_MEMORY_LIMIT=512M
    volumes:
      - ./backend:/var/www/backend
      - storage_data:/var/www/backend/storage/app/public
      - ./docker/php/php.ini:/usr/local/etc/php/php.ini:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - uno_network

  # ─── Next.js Frontend ───────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: uno_frontend
    restart: unless-stopped
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost/api/v1}
      - NEXT_PUBLIC_WS_URL=${NEXT_PUBLIC_WS_URL:-ws://localhost:6001}
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    networks:
      - uno_network

  # ─── MySQL ──────────────────────────────────────────────
  db:
    image: mysql:8.0
    container_name: uno_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-secret}
      MYSQL_DATABASE: ${DB_DATABASE:-uno_platform}
      MYSQL_USER: ${DB_USERNAME:-uno_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-uno_password}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-secret}"]
      interval: 10s
      timeout: 5s
      retries: 10
    ports:
      - "3306:3306"
    networks:
      - uno_network

  # ─── Redis ──────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: uno_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_secret} --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_secret}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "6379:6379"
    networks:
      - uno_network

  # ─── Laravel WebSockets ─────────────────────────────────
  websockets:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    container_name: uno_websockets
    restart: unless-stopped
    command: php /var/www/backend/artisan websockets:serve --port=6001
    volumes:
      - ./backend:/var/www/backend
    depends_on:
      - backend
      - redis
    ports:
      - "6001:6001"
    networks:
      - uno_network

  # ─── Queue Worker (Horizon) ─────────────────────────────
  horizon:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    container_name: uno_horizon
    restart: unless-stopped
    command: php /var/www/backend/artisan horizon
    volumes:
      - ./backend:/var/www/backend
    depends_on:
      - backend
      - redis
    networks:
      - uno_network

  # ─── Scheduler ──────────────────────────────────────────
  scheduler:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    container_name: uno_scheduler
    restart: unless-stopped
    command: >
      sh -c "while true; do
        php /var/www/backend/artisan schedule:run --no-interaction;
        sleep 60;
      done"
    volumes:
      - ./backend:/var/www/backend
    depends_on:
      - backend
    networks:
      - uno_network
